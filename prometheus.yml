#/etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['10.10.0.10:9100']
        labels:
          instancia: 'Balanceador'
      - targets: ['10.10.0.11:9100']
        labels:
          instancia: 'Servidor A'
      - targets: ['10.10.0.12:9100']
        labels:
          instancia: 'Servidor B'

  - job_name: 'nginx_exporter'
    static_configs:
      - targets: ['10.10.0.10:9113']
        labels:
          instancia: 'Balanceador'
      - targets: ['10.10.0.11:9113']
        labels:
          instancia: 'Servidor A'
      - targets: ['10.10.0.12:9113']
        labels:
          instancia: 'Servidor B'