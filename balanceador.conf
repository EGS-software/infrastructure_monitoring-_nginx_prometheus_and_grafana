#/etc/nginx/conf.d/balanceador.conf

upstream servidores_backend {
    server 10.10.0.11:80 weight=1;
    server 10.10.0.12:80 weight=1;
}
server {
    listen 80;
    location / {
        proxy_pass http://servidores_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
server {
    listen 8080;
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}